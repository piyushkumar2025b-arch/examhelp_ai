name: Security Check
on: [push, pull_request]
jobs:
  secret_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check for exposed Groq keys
        run: |
          if grep -r "gsk_" . --include="*.py" --exclude-dir=".git"; then
            echo "EXPOSED GROQ KEY FOUND"; exit 1
          fi

      - name: Check for exposed Gemini keys
        run: |
          if grep -r "AIza" . --include="*.py" --exclude-dir=".git"; then
            echo "EXPOSED GEMINI KEY FOUND"; exit 1
          fi

      - name: Check for hardcoded API key patterns
        run: |
          if grep -rE "api_key\s*=\s*['\"][a-zA-Z0-9_-]{20,}" . \
            --include="*.py" --exclude-dir=".git"; then
            echo "HARDCODED API KEY PATTERN FOUND"; exit 1
          fi

      - name: Check streak_data.json is not tracked
        run: |
          if git ls-files | grep -q "streak_data.json"; then
            echo "streak_data.json is tracked in git — remove with: git rm --cached streak_data.json"; exit 1
          fi
          echo "streak_data.json not tracked (good)"

      - name: Validate app.py syntax
        run: |
          pip install streamlit --quiet
          python -m py_compile app.py && echo "app.py syntax OK"

      - name: No exposed secrets summary
        run: echo "Security checks passed"
